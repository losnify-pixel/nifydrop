const $=id=>document.getElementById(id);let current=null;const videos=(window.NIFY_VIDEOS||[]).filter(v=>v.visible===true);function safeURL(x){try{const u=new URL(x,location.href);return ['https:','http:'].includes(u.protocol)?u.href:'#'}catch(e){return '#'}}const t=$('ticker');videos.forEach(v=>{const c=document.createElement('div');c.className='video';const im=document.createElement('img');im.src=v.image||'';im.alt=v.title||'Видео';im.onerror=()=>im.style.visibility='hidden';const title=document.createElement('div');title.className='vtitle';title.textContent=v.title||('Видео '+v.id);const sm=document.createElement('small');sm.textContent='DROP #'+v.id;title.append(sm);c.append(im,title);c.onclick=()=>openV(v);t.append(c)});if(!videos.length){t.innerHTML='<p class="hint">Пока нет опубликованных видео. В videos.js заполни слот и поставь visible:true.</p>';}function openV(v){current=v;$('dtitle').textContent=v.title||'Видео';$('ddesc').textContent=v.description||'';$('durl').href=safeURL(v.url);const im=$('dcover');im.hidden=!v.image;if(v.image){im.src=v.image;im.onerror=()=>im.hidden=true}$('player').hidden=true;$('player').pause();$('player').removeAttribute('src');$('videoModal').classList.add('open')}$('watch').onclick=()=>{if(!current)return;const p=$('player');p.src=current.video||'';p.hidden=false;p.load();p.play().catch(()=>{})};function close(){ $('videoModal').classList.remove('open');$('player').pause()}$('close').onclick=close;$('videoModal').onclick=e=>{if(e.target===$('videoModal'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
