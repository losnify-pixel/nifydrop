ursor:pointer}.video img{width:100%;aspect-ratio:9/14;object-fit:cover;display:block;background:linear-gradient(145deg,#343943,#101115)}.vtitle{padding:12px;font-size:13px}.vtitle small{display:block;color:#8e939d;margin-top:5px}.news{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;padding:4px 2px 12px;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;touch-action:pan-x;overscroll-behavior-x:contain}.news::-webkit-scrollbar{display:none}.news article{flex:0 0 min(470px,82vw);min-width:0;border:1px solid #ffffff17;background:#101116;border-radius:26px;padding:22px;scroll-snap-align:center;box-shadow:0 14px 40px #0004}.news img{width:100%;max-height:155px;object-fit:cover;border-radius:12px}.news h3{font-size:16px}.news p{color:#b4b7bf;font-size:13px;line-height:1.55;white-space:pre-wrap}.news time{font-size:10px;color:#8f949e}.news audio{width:100%}footer{border-top:1px solid #ffffff15;color:#858a94;font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:#000b;backdrop-filter:blur(13px);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.modal.open{display:flex}.dialog{width:min(650px,100%);max-height:90vh;overflow:auto;background:#17191f;border:1px solid #ffffff24;border-radius:24px;padding:22px}.dialog h2{margin-top:0}.detailcover{max-width:100%;max-height:300px;display:block;margin:15px auto;border-radius:12px}.desc{white-space:pre-wrap;color:#bfc2ca;line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.btn.primary{background:#f1f2f4;color:#111}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;color:#b4b7bf}.field input,.field textarea{width:100%;background:#0a0b0e;color:white;border:1px solid #ffffff22;border-radius:10px;padding:11px}.field textarea{min-height:75px}@media(max-width:600px){.hero{padding-top:42px}.video{flex-basis:155px}.nav a{margin-left:7px}.row{display:block}}
.navlinks{display:flex;gap:10px;flex-wrap:wrap}.navlinks a{margin:0}.pagehero{padding:35px 22px 20px;max-width:1160px;margin:auto}.back{color:#bfc2ca}.hint{color:#9da2ac;font-size:13px;margin-top:8px}.news article{max-width:86vw}.news-nav{display:grid;grid-template-columns:34px minmax(0,1fr) 34px;align-items:center;gap:0}.news-nav .news-arrow{width:34px;height:46px;padding:0;border:0;background:transparent;color:#e8e9ec;font-size:28px;box-shadow:none}.news-nav .news-arrow:active{transform:scale(.9)}.news-nav .news{min-width:0}.head .actions{display:none}@media(max-width:600px){.hero{padding-top:42px}.video{flex-basis:155px}.nav a{margin-left:7px}.row{display:block}.news-nav{grid-template-columns:24px minmax(0,1fr) 24px}.news-nav .news-arrow{width:24px;font-size:23px}.news article{flex-basis:100%;max-width:100%;padding:20px}.pagehero{padding-left:22px;padding-right:22px}}</style></head><body><header class="nav"><a class="brand" href="index.html">NIFY / DROP</a><span class="navlinks"><a class="pill" href="videos.html">Видео</a><a class="pill" href="News.html">Новости</a></span></header><main><section class="pagehero"><a class="back" href="index.html">← На главную</a><div class="eyebrow" style="margin-top:24px">02 / UPDATES</div><h1 style="font-size:clamp(48px,10vw,100px);margin:20px 0">НОВОСТИ<span class="grey"> NIFY</span></h1><p class="intro">Все обновления проекта — с картинками и аудио, если они добавлены.</p><p class="hint">читай новости<b>без тиктока</b> — тут я буду сообщать о видео пораньше и тд.</p></section><section class="section" style="max-width:1160px;margin:auto;padding:22px"><div class="head"><div><h2>Все новости</h2><div class="sub">Листай вбок, как ленту видео</div></div></div><div class="news-nav"><button class="news-arrow" id="prevNews" aria-label="Предыдущая новость">‹</button><div class="news" id="newslist"></div><button class="news-arrow" id="nextNews" aria-label="Следующая новость">›</button></div></section></main><footer><span>© NIFY DROP</span><span>Dark glass. New drops.</span></footer><script src="News.js"></script><script>const news=(window.NIFY_NEWS||[]).filter(v=>v.visible===true);const n=document.getElementById('newslist');news.slice().reverse().forEach(v=>{const a=document.createElement('article');if(v.image){const im=document.createElement('img');im.src=v.image;im.alt='';im.onerror=()=>im.remove();a.append(im)}const time=document.createElement('time');time.textContent=v.date||'UPDATE';const h=document.createElement('h3');h.textContent=v.title||'Новость';const p=document.createElement('p');p.textContent=v.text||'';a.append(time,h,p);if(v.audio){const au=document.createElement('audio');au.controls=true;au.src=v.audio;a.append(au)}n.append(a)});if(!news.length){n.innerHTML='<p class="hint">Пока нет опубликованных новостей. В News.js заполни слот и поставь visible:true.</p>';}const step=()=>{const card=n.querySelector('article');return card?card.getBoundingClientRect().width+12:300};document.getElementById('prevNews').addEventListener('click',()=>n.scrollBy({left:-step(),behavior:'smooth'}));document.getElementById('nextNews').addEventListener('click',()=>n.scrollBy({left:step(),behavior:'smooth'}));</script></body></html>
